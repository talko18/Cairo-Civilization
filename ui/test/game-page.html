<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Game tests</title>
<style>body{margin:0;background:#222;color:#ddd;font:12px monospace} iframe{position:absolute;left:0;top:0;width:1200px;height:760px;border:0;background:#fff}</style>
</head>
<body>
<script>
// The real index.html in an iframe, served by run-game.mjs with a recorded game state.
// Each test boots its own game when it changes things; read-only tests share one.
// State (G, selected, ...) is declared with let/const, so it is reached with W.eval.
const TESTS = [];
const test = (name, fn) => TESTS.push({name, fn});
const assert = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let current = null;
function boot(qs) {
  if (current) { current.remove(); current = null; }
  return new Promise((resolve, reject) => {
    const f = document.createElement('iframe');
    f.src = '/?' + (qs || 'x') + '&_=' + Math.random();
    document.body.appendChild(f);
    current = f;
    const t0 = Date.now();
    (function poll() {
      let ready = false;
      try {
        const W = f.contentWindow;
        ready = W.eval('typeof r3dReady !== "undefined" && (r3dReady || document.getElementById("map-fallback").style.display === "flex")');
      } catch (e) { /* not loaded yet */ }
      if (ready) return resolve(f.contentWindow);
      if (Date.now() - t0 > 40000) return reject(new Error('the game did not start'));
      setTimeout(poll, 100);
    })();
  });
}

// ---- helpers over a booted game window W ----
const ev = (W, expr) => W.eval(expr);
const draw = (W, n) => { for (let i = 0; i < (n || 1); i++) { W.R3D.requestRender(); W.__r3d.step(W.performance.now() + i); } };
const area = (W) => W.document.getElementById('map-area');
const pe = (W, type, x, y, extra) => new W.PointerEvent(type, Object.assign({bubbles: true, cancelable: true, clientX: x, clientY: y, button: 0, pointerType: 'mouse'}, extra));
const pointAt = (W, q, r) => { const P = W.__r3d.project(q, r); assert(P, 'no screen position for ' + q + ',' + r); return P; };
// a click as a real browser sends it: pointerdown on the map, pointerup on the window
const clickHex = (W, q, r) => { const P = pointAt(W, q, r); W.document.getElementById('map-canvas').dispatchEvent(pe(W, 'pointerdown', P.x, P.y)); W.dispatchEvent(pe(W, 'pointerup', P.x, P.y)); };
const key = (W, k, type) => W.document.dispatchEvent(new W.KeyboardEvent(type || 'keydown', {key: k, bubbles: true, cancelable: true}));
const sel = (W) => JSON.parse(ev(W, 'JSON.stringify(selected && {type: selected.type, id: selected.id, q: selected.q, r: selected.r, player: selected.player})'));
const cam = (W) => W.R3D.getCameraView();
// Replace R3D.<name> with a recorder that still calls through.
function spy(W, name) {
  const orig = W.R3D[name], calls = [];
  W.R3D[name] = function () { const a = [...arguments]; const rec = {args: a, fogAtDest: null, ret: undefined};
    if (name === 'playAnimation' && a[0] && Number.isInteger(a[0].toQ)) rec.fogAtDest = W.R3D.fogAt(a[0].toQ, a[0].toR);
    calls.push(rec); rec.ret = orig.apply(this, a); return rec.ret; };
  calls.restore = () => { W.R3D[name] = orig; };
  return calls;
}
const hexOfWorld = (W, x, z) => W.R3DCore.worldToHex(x, z, 32, 20);
const hasKeys = (o, ...ks) => ks.every((k) => k in o);

// ───────────────────────── source ─────────────────────────
test('the 2D map renderer is gone from index.html', async () => {
  const src = await (await fetch('/index.html')).text();
  assert(!/function drawMap\s*\(/.test(src), 'drawMap must be deleted');
  assert(!/function drawUnit\s*\(/.test(src), 'drawUnit must be deleted');
  assert(/function drawMinimap\s*\(/.test(src), 'the minimap stays 2D');
  for (const dead of ['pixelToHex', 'startAnimation', 'animLoop', 'animT', 'camX', 'camY', 'ctx2d', 'activeAnimations', 'resizeCanvas'])
    assert(!new RegExp('\\b' + dead + '\\b').test(src), dead + ' is still referenced');
  assert(!/\blet zoom\b/.test(src), 'the zoom global is still there');
  assert(!/'Arrow(Up|Down|Left|Right)'/.test(src), "the page's own arrow-key pan is still there: the renderer claims arrows");
  assert(/wasd:\s*false/.test(src), 'WASD must stay off: it collides with A (attack) and S (skip)');
});

// ───────────────────────── boot ─────────────────────────
test('the game boots on the 3D renderer and the map canvas is WebGL, not 2D', async () => {
  const W = await boot();
  assert(ev(W, 'r3dReady') === true, 'renderer not ready');
  assert(ev(W, 'document.getElementById("map-fallback").style.display') !== 'flex', 'fallback message shown with WebGL available');
  assert(ev(W, 'canvas.getContext("2d")') === null, 'the map canvas has a 2D context: R3D cannot own it');
  assert(W.__r3d.labelCount() > 0, 'no unit or city labels drawn');
});

test('without WebGL the map area says so, and the rest of the game still works', async () => {
  const W = await boot('nowebgl');
  assert(ev(W, 'r3dReady') === false, 'renderer claims to be ready without WebGL');
  const fb = W.document.getElementById('map-fallback');
  assert(fb.style.display === 'flex' && /WebGL/.test(fb.textContent), 'no clear message: ' + JSON.stringify(fb.textContent));
  assert(ev(W, 'document.getElementById("sidebar-body").children.length') > 0, 'sidebar did not render');
  // every map call is a safe no-op
  ev(W, 'redrawMap(); resyncMap(); syncMap3d(); zoomAtCenter(1); updateMinimapViewport(); updateZoomLabel(); panToHex(3,3); centerCamera(true); startMove(); cancelMode();');
});

test('the no-renderer stand-in has exactly the real R3D surface, and every call is a safe no-op', async () => {
  const real = Object.keys((await boot()).R3D).sort();
  const W = await boot('norenderer');
  assert(typeof W.__r3d === 'undefined', 'precondition: render3d.js did not load');
  const stub = Object.keys(W.R3D).sort();
  assert(JSON.stringify(stub) === JSON.stringify(real), 'stand-in drifted from the real R3D. missing: ' +
    real.filter((k) => !stub.includes(k)) + ' extra: ' + stub.filter((k) => !real.includes(k)));
  for (const k of real) assert(typeof W.R3D[k] === 'function', k + ' is not a function on the stand-in');
  for (const k of real) W.R3D[k](1, 1, {}, {}); // none may throw
  assert(ev(W, 'document.getElementById("sidebar-body").children.length') > 0, 'sidebar did not render');
});

// ───────────────────────── input ─────────────────────────
test('a click reaches handleClick through real pointer events, and a drag is not a click', async () => {
  const W = await boot();
  clickHex(W, 11, 10);
  const s = sel(W);
  assert(s && s.type === 'unit' && s.id === 1 && s.player === 0, 'clicking the warrior selected ' + JSON.stringify(s));
  clickHex(W, 8, 9);
  assert(sel(W) === null, 'clicking empty ground did not clear the selection');
  clickHex(W, 11, 10);
  const P = pointAt(W, 8, 9), c = W.document.getElementById('map-canvas');
  c.dispatchEvent(pe(W, 'pointerdown', P.x, P.y)); W.dispatchEvent(pe(W, 'pointermove', P.x + 30, P.y)); W.dispatchEvent(pe(W, 'pointerup', P.x + 30, P.y));
  assert(sel(W) && sel(W).type === 'unit', 'a drag counted as a click and cleared the selection');
});

test('the map shows the grabbing cursor class while a button is held', async () => {
  const W = await boot();
  const P = pointAt(W, 11, 9);
  W.document.getElementById('map-canvas').dispatchEvent(pe(W, 'pointerdown', P.x, P.y));
  assert(area(W).classList.contains('dragging'), 'no dragging class while the button is down');
  W.dispatchEvent(pe(W, 'pointerup', P.x, P.y));
  assert(!area(W).classList.contains('dragging'), 'dragging class stuck after release');
});

test('a gesture the browser cancels (pointercancel) ends the drag: grab cursor off, hover alive, no phantom click', async () => {
  const W = await boot();
  const cvs = W.document.getElementById('map-canvas'), tip = W.document.getElementById('tile-tip');
  const P = pointAt(W, 11, 9), Q = pointAt(W, 8, 9);
  clickHex(W, 11, 10);
  const before = JSON.stringify(sel(W));
  // the pointer goes down on the map and the browser takes the gesture over: no pointerup will ever come
  cvs.dispatchEvent(pe(W, 'pointerdown', Q.x, Q.y));
  assert(area(W).classList.contains('dragging'), 'precondition: the grab cursor is on');
  W.dispatchEvent(pe(W, 'pointercancel', Q.x, Q.y));
  assert(!area(W).classList.contains('dragging'), 'the grabbing cursor stayed on after pointercancel');
  // hover is suppressed while a drag is in progress: after a cancel it must work again
  tip.style.display = 'none';
  cvs.dispatchEvent(pe(W, 'pointermove', P.x, P.y));
  assert(tip.style.display === 'block' && /\(11,9\)/.test(tip.textContent), 'hover is dead after pointercancel (a drag is still "in progress"): ' + tip.style.display);
  // and the next release, which belongs to no press, must not be read as a click on the empty ground
  W.dispatchEvent(pe(W, 'pointerup', Q.x, Q.y));
  assert(JSON.stringify(sel(W)) === before, 'a release after a cancelled gesture was treated as a click: ' + before + ' -> ' + JSON.stringify(sel(W)));
});

test('hovering shows the tile tooltip and leaving hides it', async () => {
  const W = await boot();
  const P = pointAt(W, 11, 9), tip = W.document.getElementById('tile-tip');
  W.document.getElementById('map-canvas').dispatchEvent(pe(W, 'pointermove', P.x, P.y));
  assert(tip.style.display === 'block' && /\(11,9\)/.test(tip.textContent), 'tooltip: ' + tip.style.display + ' ' + tip.textContent);
  assert(/Grassland|Plains|Hills|Desert|Tundra|Snow|Coast|Ocean|Mountain/.test(tip.textContent), 'tooltip has no terrain name');
  area(W).dispatchEvent(new W.MouseEvent('mouseleave', {bubbles: false}));
  assert(tip.style.display === 'none', 'tooltip stayed after the pointer left');
});

// Decision 12: "Unexplored tiles must answer 'Unexplored'; remembered tiles show
// the land but not its occupants." The renderer computes fog-gated facts for
// onTileHover, but the page deliberately does NOT use them: showTooltip builds
// its text from the page's own state (yields, owner, lock status, myPlayer), so
// ITS gate (isTileExplored / isTileVisible in showTooltip) is the one that
// ships, and this is the test that pins it.
test('the tooltip names nothing on unexplored ground, and no enemy on remembered ground', async () => {
  const W = await boot();
  const tip = W.document.getElementById('tile-tip'), canvas = W.document.getElementById('map-canvas');
  assert(ev(W, 'fogActive()') === true, 'precondition: fog of war is on');
  const hover = (q, r) => { tip.style.display = 'none'; const P = pointAt(W, q, r); canvas.dispatchEvent(pe(W, 'pointermove', P.x, P.y)); };
  // 1. unexplored ground: the tooltip says so and gives away nothing about the tile
  const un = JSON.parse(ev(W, 'JSON.stringify(G.tiles.filter(t => !isTileExplored(t.q, t.r) && t.terrain !== 0 && t.resource).map(t => [t.q, t.r]))'))
    .find(([q, r]) => { const P = W.__r3d.project(q, r); return P && P.x > 20 && P.y > 20 && P.x < 1100 && P.y < 700; });
  assert(un, 'fixture has no on-screen unexplored land tile with a resource');
  hover(un[0], un[1]);
  assert(tip.style.display === 'block', 'no tooltip on unexplored ground');
  assert(tip.textContent === 'Unexplored (' + un[0] + ',' + un[1] + ')',
    'the tooltip on unexplored ground says: ' + JSON.stringify(tip.textContent));
  // 2. remembered ground (explored, out of sight) holding an enemy unit and an enemy city
  const R = ev(W, `(() => {
    const t = G.tiles.find(t => isTileExplored(t.q, t.r) && !isTileVisible(t.q, t.r) && t.terrain !== 0 && t.terrain !== 12);
    if (t) return [t.q, t.r];
    const u = G.tiles.find(t => t.terrain !== 0 && t.terrain !== 12 && !isTileVisible(t.q, t.r) && !exploredSet.has(t.r * COLS + t.q));
    exploredSet.add(u.r * COLS + u.q); return [u.q, u.r];
  })()`);
  ev(W, `(() => { const [q, r] = ${JSON.stringify(R)}; const e = G.players[1];
    e.units.push({id: 99, unitType: 3, q, r, hp: 77, mp: 2, charges: 0, fortifyTurns: 0});
    e.cities.push({id: 9, name: 'Memphis', q, r, population: 4, hp: 200, buildings: 0, foodStockpile: 0, prodStockpile: 0, production: 0, foundedTurn: 1, isCapital: false, lockedTiles: []}); })()`);
  hover(R[0], R[1]);
  assert(tip.style.display === 'block' && /\(\d+,\d+\)/.test(tip.textContent), 'no tooltip on remembered ground');
  assert(!/Unexplored/.test(tip.textContent), 'remembered ground was reported as unexplored: ' + tip.textContent);
  assert(/Grassland|Plains|Hills|Desert|Tundra|Snow|Coast|Mountain/.test(tip.textContent), 'remembered ground lost its terrain: ' + tip.textContent);
  assert(!/Warrior|HP:77|MP:2/.test(tip.textContent), 'the tooltip names an enemy unit on remembered ground: ' + tip.textContent);
  assert(!/Pop:/.test(tip.textContent), 'the tooltip gives the population of an enemy city out of sight: ' + tip.textContent);
  // 3. the same hex in sight DOES name the occupant, so the checks above are not vacuous
  ev(W, `visibleSet.add(${R[1]} * COLS + ${R[0]})`);
  tip.style.display = 'none'; hover(un[0], un[1]); hover(R[0], R[1]);
  assert(/Warrior/.test(tip.textContent), 'precondition: a visible enemy unit is named: ' + tip.textContent);
});

test('arrow keys pan once per press; WASD is off, so A is attack and S is skip', async () => {
  const W = await boot();
  clickHex(W, 11, 10); draw(W);
  const x0 = cam(W).x;
  W.dispatchEvent(new W.KeyboardEvent('keydown', {key: 'ArrowRight', bubbles: true, cancelable: true}));
  for (let i = 0; i < 6; i++) { W.__r3d.step(W.performance.now() + 100 * (i + 1)); }
  W.dispatchEvent(new W.KeyboardEvent('keyup', {key: 'ArrowRight', bubbles: true}));
  assert(cam(W).x > x0 + 0.05, 'ArrowRight did not pan: ' + x0 + ' -> ' + cam(W).x);
  const x1 = cam(W).x;
  key(W, 'a');
  assert(ev(W, 'actionMode') === 'attack', 'A did not start an attack: WASD is stealing it (' + ev(W, 'actionMode') + ')');
  key(W, 'Escape');
  for (let i = 0; i < 6; i++) W.__r3d.step(W.performance.now() + 1000 + 100 * i);
  assert(Math.abs(cam(W).x - x1) < 0.2, 'a letter key panned the camera');
  const mp = ev(W, 'G.players[0].units.find(u => u.id === 1).mp');
  key(W, 's');
  assert(ev(W, 'G.players[0].units.find(u => u.id === 1).mp') === 0 && mp > 0, 'S did not skip the unit');
});

test('typing in an input, select or editable field never fires a game shortcut; Ctrl/Meta/Alt combos do not either', async () => {
  const W = await boot();
  clickHex(W, 11, 10); draw(W);
  const doc = W.document, mk = (tag, attrs) => { const el = doc.createElement(tag); Object.assign(el, attrs || {}); doc.body.appendChild(el); return el; };
  const input = mk('input', {type: 'text'}), area2 = mk('textarea'), select = mk('select'), edit = mk('div');
  edit.setAttribute('contenteditable', 'true'); edit.tabIndex = 0;
  const unit = () => ev(W, 'G.players[0].units.find(u => u.id === 1).mp'), mp0 = unit();
  const fire = (el, k, extra) => { const e = new W.KeyboardEvent('keydown', Object.assign({key: k, bubbles: true, cancelable: true}, extra)); el.dispatchEvent(e); return e; };
  const state = () => JSON.stringify([ev(W, 'actionMode'), unit(), ev(W, 'document.getElementById("rpanel").classList.contains("open")'), cam(W).span, ev(W, 'pendingActions.length'), sel(W)]);
  // control: the same keys on the page body DO act, so the test below is not vacuous
  const s0 = state(), z0 = cam(W).span;
  fire(doc.body, '-'); draw(W);
  assert(cam(W).span > z0, 'control: - on the body did not zoom out');
  fire(doc.body, 'm'); assert(ev(W, 'actionMode') === 'move', 'control: M on the body did not start a move'); key(W, 'Escape');
  fire(doc.body, 'p'); assert(ev(W, 'document.getElementById("rpanel").classList.contains("open")'), 'control: P on the body did not open Production'); key(W, 'Escape');
  ev(W, 'closePanel()');
  const before = state();
  for (const [name, el] of [['input', input], ['textarea', area2], ['select', select], ['contenteditable', edit]]) {
    el.focus();
    for (const k of ['-', '+', '=', 'm', 'a', 'r', 'f', 's', 'b', 't', 'p', 'e', 'v', 'Tab', 'Escape']) {
      const e = fire(el, k); draw(W);
      assert(!e.defaultPrevented, 'typing "' + k + '" in a ' + name + ' was preventDefault-ed: the field cannot receive it');
      assert(state() === before, 'typing "' + k + '" in a ' + name + ' triggered a shortcut: ' + before + ' -> ' + state());
    }
  }
  // modifier combos belong to the browser (Ctrl+- is browser zoom, Ctrl+E the search bar, Alt+Tab the OS)
  for (const mod of ['ctrlKey', 'metaKey', 'altKey']) for (const k of ['-', '+', 'e', 't', 'p', 'm', 'Tab']) {
    const e = fire(doc.body, k, {[mod]: true}); draw(W);
    assert(!e.defaultPrevented && state() === before, mod + '+' + k + ' triggered a game shortcut: ' + before + ' -> ' + state());
  }
  [input, area2, select, edit].forEach((el) => el.remove());
});

test('Tab cycles units and pans through R3D.panToHex', async () => {
  const W = await boot();
  const calls = spy(W, 'panToHex');
  key(W, 'Tab');
  assert(calls.length === 1 && calls[0].args[0] === 11 && calls[0].args[1] === 10, 'panToHex calls: ' + JSON.stringify(calls.map((c) => c.args)));
  assert(sel(W) && sel(W).id === 1, 'Tab did not select the unit');
  ev(W, "selectFromSidebar('city', 0, 0)");
  assert(calls.length === 2, 'sidebar selection did not pan');
});

// ───────────────────────── selection and overlays ─────────────────────────
test('selecting a unit draws its ring; move, attack and ranged range light the right tiles', async () => {
  const W = await boot();
  clickHex(W, 11, 10); draw(W);
  const ring = W.__r3d.ringCentre('sel'), c = W.R3DCore.hexCenter(11, 10);
  assert(ring && Math.hypot(ring.x - c.x, ring.z - c.z) < 0.3, 'selection ring is not on the unit: ' + JSON.stringify(ring));
  key(W, 'm'); draw(W);
  assert(ev(W, 'actionMode') === 'move' && W.__r3d.litTiles() >= 6, 'move range lit ' + W.__r3d.litTiles() + ' tiles');
  for (const t of W.__r3d.litList()) {
    const h = hexOfWorld(W, t.x, t.z);
    assert(W.R3DCore.hexDist(11, 10, h.q, h.r) <= 2, 'a move highlight is beyond the unit range at ' + h.q + ',' + h.r);
    assert(t.color === W.R3DCore.OV.move, 'move colour');
    assert(![0, 1, 12].includes(ev(W, 'getTile(' + h.q + ',' + h.r + ').terrain')), 'a move highlight on water or mountain at ' + h.q + ',' + h.r);
  }
  key(W, 'Escape'); draw(W);
  assert(W.__r3d.litTiles() === 0, 'cancelling move left highlights behind');
  // an enemy next to us: attack mode lights exactly that tile, in the attack colour
  ev(W, 'G.players[1].units.push({id: 77, unitType: 3, q: 12, r: 10, hp: 80, mp: 2, charges: 0, fortify: 0}); resyncMap();');
  key(W, 'a'); draw(W);
  const atk = W.__r3d.litList();
  assert(atk.length === 1 && atk[0].color === W.R3DCore.OV.atk, 'attack range: ' + JSON.stringify(atk));
  const h = hexOfWorld(W, atk[0].x, atk[0].z);
  assert(h.q === 12 && h.r === 10, 'attack highlight on the wrong tile ' + h.q + ',' + h.r);
  key(W, 'Escape');
  // ranged: an archer reaches two tiles
  ev(W, 'G.players[1].units.push({id: 78, unitType: 3, q: 13, r: 9, hp: 80, mp: 2, charges: 0, fortify: 0}); selected = {...G.players[0].units.find(u => u.id === 1), type: "unit", player: 0, unitType: 5}; resyncMap(); startRanged();');
  draw(W);
  const rng = W.__r3d.litList();
  assert(rng.length >= 1 && rng.every((t) => t.color === W.R3DCore.OV.rng), 'ranged range colour: ' + JSON.stringify(rng.map((t) => t.color)));
  const far = rng.map((t) => hexOfWorld(W, t.x, t.z)).find((q) => q.q === 13 && q.r === 9);
  assert(far, 'ranged highlight missed the target two tiles away');
});

test('selecting a city shows worked, locked and unworked tiles and their yield pills', async () => {
  const W = await boot();
  ev(W, "selectFromSidebar('city', 0, 0)"); draw(W);
  const worked = JSON.parse(ev(W, 'JSON.stringify(getWorkedTiles(G.players[0].cities[0]))'));
  const locked = worked.filter((t) => t.locked), auto = worked.filter((t) => !t.locked);
  assert(locked.length === 1 && locked[0].q === 11 && locked[0].r === 9, 'fixture: expected one locked tile at 11,9');
  for (const t of worked) assert(W.__r3d.yieldLabelOn(t.q, t.r), 'no yield pill on worked tile ' + t.q + ',' + t.r);
  assert(/\u{1F512}/u.test(W.__r3d.yieldLabelOn(11, 9).textContent), 'the locked tile has no lock icon: ' + W.__r3d.yieldLabelOn(11, 9).textContent);
  const lit = W.__r3d.litList().map((t) => Object.assign({}, hexOfWorld(W, t.x, t.z), {color: t.color}));
  const colour = (q, r) => (lit.find((t) => t.q === q && t.r === r) || {}).color;
  assert(colour(11, 9) === W.R3DCore.OV.lock, 'locked tile is not drawn in the lock colour');
  assert(auto.length > 0 && auto.every((t) => colour(t.q, t.r) === W.R3DCore.OV.work), 'auto tiles are not in the work colour');
  assert(lit.some((t) => t.color === W.R3DCore.OV.dim), 'no dim overlay on unworked territory');
  // the yield pill shows what the tooltip would
  const y = ev(W, 'JSON.stringify(computeCityCenterYield(getTile(11, 10)))'), yy = JSON.parse(y);
  const txt = W.__r3d.yieldLabelOn(11, 10).textContent;
  assert(txt.includes(yy.food + 'F') && txt.includes(yy.prod + 'P'), 'city-centre pill "' + txt + '" vs ' + y);
  // deselecting removes pills and highlights
  key(W, 'Escape'); draw(W);
  assert(!W.__r3d.yieldLabelOn(11, 10) && W.__r3d.litTiles() === 0, 'deselecting left pills or highlights behind');
});

test('the city shows its amenity dot (amenityOf is wired)', async () => {
  const W = await boot();
  draw(W);
  const el = W.__r3d.labelFor('city', 0, 0);
  assert(el, 'no city label');
  const am = el.querySelector('.am');
  assert(am && am.style.display !== 'none' && /^am am-(ecstatic|happy|content|displeased|unhappy|unrest)$/.test(am.className), 'amenity dot: ' + (am && am.className + '/' + am.style.display));
});

// ───────────────────────── camera, zoom, minimap, panel ─────────────────────────
test('zoom buttons, + / - keys and the wheel zoom the camera and the label follows', async () => {
  const W = await boot();
  draw(W);
  const lbl = () => parseInt(W.document.getElementById('zoom-lbl').textContent, 10);
  assert(lbl() === 100, 'default label ' + lbl());
  const s0 = cam(W).span;
  W.document.querySelector('#zoom-controls button:first-child').click(); draw(W);
  assert(cam(W).span < s0 * 0.9 && lbl() > 110, '+ button: span ' + s0 + ' -> ' + cam(W).span + ', label ' + lbl());
  W.document.querySelector('#zoom-controls button:last-child').click(); draw(W);
  assert(Math.abs(cam(W).span - s0) < s0 * 0.02 && lbl() === 100, '- button did not undo +: ' + cam(W).span + ' label ' + lbl());
  key(W, '+'); draw(W);
  assert(cam(W).span < s0 * 0.9, '+ key did not zoom in');
  key(W, '-'); key(W, '-'); draw(W);
  assert(cam(W).span > s0 * 1.1 && lbl() < 90, '- key did not zoom out');
  const s1 = cam(W).span, P = pointAt(W, 11, 10);
  W.document.getElementById('map-canvas').dispatchEvent(new W.WheelEvent('wheel', {deltaY: -300, clientX: P.x, clientY: P.y, bubbles: true, cancelable: true}));
  for (let i = 0; i < 8; i++) W.__r3d.step(W.performance.now() + 60 * i);
  assert(cam(W).span < s1, 'the wheel did not zoom in');
});

test('the minimap viewport follows the 3D camera, and a minimap click recentres it', async () => {
  const W = await boot();
  const vp = W.document.getElementById('minimap-viewport');
  W.R3D.centerOn(4, 4); draw(W);

  const w0 = parseFloat(vp.style.width);
  W.R3D.zoomBy(2); draw(W);
  assert(parseFloat(vp.style.width) < w0 * 0.7, 'viewport did not shrink when zooming in: ' + w0 + ' -> ' + vp.style.width);
  const mm = W.document.getElementById('minimap-canvas').getBoundingClientRect();

  const c = W.R3DCore.hexCenter(hx, hy);
  assert(Math.hypot(cam(W).x - c.x, cam(W).z - c.z) < 1.8, 'minimap click centred ' + JSON.stringify(cam(W)) + ' not on ' + JSON.stringify(c));

test('camera changes never read layout: the minimap rectangle and zoom label use the cached map size', async () => {
  const W = await boot();
  draw(W);
  const cv = W.document.getElementById('map-canvas'), vp = W.document.getElementById('minimap-viewport');
  const proto = Object.getOwnPropertyDescriptor(W.Element.prototype, 'clientWidth').get;
  let reads = 0;
  Object.defineProperty(cv, 'clientWidth', {configurable: true, get() { reads++; return proto.call(this); }});
  Object.defineProperty(cv, 'clientHeight', {configurable: true, get() { reads++; return W.Object.getOwnPropertyDescriptor(W.Element.prototype, 'clientHeight').get.call(this); }});
  try {
    // every kind of camera change: zoom, pan, fly-to, keys
    W.R3D.zoomBy(1.4); draw(W, 2);
    W.R3D.centerOn(6, 5); draw(W, 2);
    W.R3D.zoomBy(0.8); draw(W, 2);
    assert(reads === 0, 'camera changes read canvas.clientWidth/Height ' + reads + 'x: that forces layout on every frame');
    // and the rectangle really is computed from the cache, not from some other source
    const h0 = parseFloat(vp.style.height);
    ev(W, 'mapSize.w *= 2; updateMinimapViewport();');
    assert(parseFloat(vp.style.height) < h0 * 0.7, 'the rectangle ignored the cached size: height ' + h0 + ' -> ' + vp.style.height);
  } finally { delete cv.clientWidth; delete cv.clientHeight; }
});

test('opening and closing the right panel resizes the renderer to #map-area', async () => {

test('switching between the Production and Research panels keeps the canvas, zoom label and minimap in step with #map-area', async () => {
  const W = await boot();
  const cv = W.document.getElementById('map-canvas'), vp = W.document.getElementById('minimap-viewport');
  const lbl = () => W.document.getElementById('zoom-lbl').textContent;
  const settle = async () => { await wait(600); draw(W, 2); };
  const sync = (what) => {
    const pr = W.__r3d.pixelRatio();
    assert(cv.width === Math.round(area(W).clientWidth * pr) && cv.height === Math.round(area(W).clientHeight * pr),
      what + ': canvas backing store ' + cv.width + 'x' + cv.height + ' vs #map-area ' + area(W).clientWidth + 'x' + area(W).clientHeight);
  };
  // the reference state: Production open, as a player first sees it
  ev(W, "openPanel('prod')"); await settle(); sync('prod (first)');
  const ref = {lbl: lbl(), w: parseFloat(vp.style.width), h: parseFloat(vp.style.height)};
  assert(ref.lbl === '100%', 'reference zoom label ' + ref.lbl);
  // the review's sequence: both panels open, one of them 340px wider
  ev(W, "openPanel('tech')"); await settle(); sync('tech (after prod)');
  assert(lbl() === '100%', 'zoom label with the Research panel open: ' + lbl() + ' (nothing was zoomed)');
  ev(W, "openPanel('prod')"); await settle(); sync('prod (after tech)');
  assert(lbl() === ref.lbl, 'zoom label after the toggle: ' + lbl() + ', expected ' + ref.lbl);
  assert(Math.abs(parseFloat(vp.style.width) - ref.w) < 1 && Math.abs(parseFloat(vp.style.height) - ref.h) < 1,
    'minimap rectangle ' + vp.style.width + ' x ' + vp.style.height + ', expected ' + ref.w + 'px x ' + ref.h + 'px');
  ev(W, 'closePanel()'); await settle(); sync('closed');
});

test('the quality menu changes shadows, props and resolution, and remembers the choice', async () => {
  let W = await boot();
  const box = (k) => W.document.querySelector('#quality-menu input[data-q="' + k + '"]');
  const flip = (k, on) => { box(k).checked = on; box(k).dispatchEvent(new W.Event('change', {bubbles: true})); };
  assert(W.__r3d.shadowsEnabled() && W.__r3d.propsVisible() && W.__r3d.decorMeshCount() > 0, 'precondition: everything on');
  W.document.getElementById('quality-btn').click();
  assert(W.document.getElementById('quality-menu').classList.contains('open'), 'Quality button did not open the menu');
  key(W, 'Escape');
  assert(!W.document.getElementById('quality-menu').classList.contains('open'), 'Escape did not close the menu');
  flip('shadows', false);
  assert(W.__r3d.shadowsEnabled() === false, 'shadows still on');
  assert(W.__r3d.propsVisible() === true, 'turning shadows off hid the props');
  flip('props', false);
  assert(W.__r3d.propsVisible() === false, 'props still visible');
  // real scenery stays: features, resources, improvements are information, not decoration
  assert(W.__r3d.sceneryMeshCount() > W.__r3d.decorMeshCount(), 'props off must not hide every scenery mesh');
  Object.defineProperty(W, 'devicePixelRatio', {value: 2, configurable: true});
  flip('fullRes', false);
  assert(W.__r3d.pixelRatio() === 1, 'pixel ratio did not drop back');
  flip('fullRes', true);
  assert(W.__r3d.pixelRatio() === 2, 'full resolution did not raise the pixel ratio: ' + W.__r3d.pixelRatio());
  // it survives a rebuild of the scenery (a terrain change) and a fresh page load
  ev(W, 'R3D.rebuildTile(12, 10)');
  assert(W.__r3d.propsVisible() === false, 'a scenery rebuild brought the props back');
  W = await boot();
  assert(W.__r3d.shadowsEnabled() === false && W.__r3d.propsVisible() === false, 'saved quality was not restored on load');
  assert(!box('shadows').checked && !box('props').checked && box('fullRes').checked, 'the menu does not show the saved state');
  W.localStorage.removeItem('cairoCivQuality');
});

test('full resolution is on by default when nothing is stored', async () => {
  const stash = localStorage.getItem('cairoCivQuality');
  localStorage.removeItem('cairoCivQuality');
  try {
    const W = await boot();
    assert(ev(W, 'quality.fullRes') === true, 'the page defaults fullRes to ' + ev(W, 'quality.fullRes'));
    assert(W.document.querySelector('#quality-menu input[data-q="fullRes"]').checked === true, 'the Full resolution box is not ticked by default');
    // the renderer applied it: with a 2x screen the pixel ratio is 2, not the pinned 1
    Object.defineProperty(W, 'devicePixelRatio', {value: 2, configurable: true});
    W.R3D.resize();
    assert(W.__r3d.pixelRatio() === 2, 'default pixel ratio on a 2x screen: ' + W.__r3d.pixelRatio());
    Object.defineProperty(W, 'devicePixelRatio', {value: 3, configurable: true});
    W.R3D.resize();
    assert(W.__r3d.pixelRatio() === 2, 'the pixel ratio cap of 2 is gone: ' + W.__r3d.pixelRatio());
  } finally { if (stash === null) localStorage.removeItem('cairoCivQuality'); else localStorage.setItem('cairoCivQuality', stash); }
});

test('a stored fullRes=false is still honoured, and a stored value for one key leaves the others at their defaults', async () => {
  const stash = localStorage.getItem('cairoCivQuality');
  try {
    localStorage.setItem('cairoCivQuality', JSON.stringify({fullRes: false}));
    const W = await boot();
    assert(ev(W, 'quality.fullRes') === false, 'a stored false was overridden by the new default');
    assert(W.document.querySelector('#quality-menu input[data-q="fullRes"]').checked === false, 'the box ignores the stored false');
    Object.defineProperty(W, 'devicePixelRatio', {value: 2, configurable: true});
    W.R3D.resize();
    assert(W.__r3d.pixelRatio() === 1, 'a stored false did not pin the pixel ratio to 1: ' + W.__r3d.pixelRatio());
    assert(ev(W, 'quality.shadows') === true && ev(W, 'quality.props') === true, 'unstored keys lost their defaults');
  } finally { if (stash === null) localStorage.removeItem('cairoCivQuality'); else localStorage.setItem('cairoCivQuality', stash); }
});

test('a state refresh rebuilds the map only when terrain changed', async () => {
  const W = await boot();
  const rebuild = spy(W, 'rebuildMap'), sync = spy(W, 'syncState');
  const base = JSON.parse(ev(W, 'JSON.stringify(G)'));
  const serve = (state) => { W.fetch = async () => ({ok: true, json: async () => JSON.parse(JSON.stringify(state))}); };
  serve(base); await W.refreshState();
  assert(rebuild.length === 0 && sync.length >= 1, 'an unchanged refresh rebuilt the map ' + rebuild.length + 'x (sync ' + sync.length + 'x)');
  const changed = JSON.parse(JSON.stringify(base));
  changed.tiles.find((t) => t.q === 13 && t.r === 11).improvement = 1;
  serve(changed); await W.refreshState();
  assert(rebuild.length === 1, 'a terrain change rebuilt the map ' + rebuild.length + 'x');
  serve(changed); await W.refreshState();
  assert(rebuild.length === 1, 'the same terrain again rebuilt the map a second time');
  const moved = JSON.parse(JSON.stringify(changed)); moved.players[0].units.find((u) => u.id === 1).q = 12;
  serve(moved); await W.refreshState();
  assert(rebuild.length === 1 && sync.length >= 3, 'a unit moving rebuilt terrain');
});

test('capturing a city (it changes owner) does not rebuild the map; a city appearing or vanishing does', async () => {
  const W = await boot();
  const rebuild = spy(W, 'rebuildMap');
  const base = JSON.parse(ev(W, 'JSON.stringify(G)'));
  const serve = (state) => { W.fetch = async () => ({ok: true, json: async () => JSON.parse(JSON.stringify(state))}); };
  const clone = (o) => JSON.parse(JSON.stringify(o));
  assert(base.players[0].cities.length >= 1 && base.players[1].cities.length >= 1, 'fixture: each player needs a city');
  // capture: player 0's city moves into player 1's list, so the cities come in a different order
  const captured = clone(base); captured.players[1].cities.push(captured.players[0].cities.shift());
  serve(captured); await W.refreshState();
  assert(rebuild.length === 0, 'a captured city (same positions, other owner) rebuilt the whole map ' + rebuild.length + 'x');
  // and the other direction (player 1's city taken, order preserved)
  const back = clone(base); back.players[0].cities.push(back.players[1].cities.shift());
  serve(back); await W.refreshState();
  assert(rebuild.length === 0, 'the other capture direction rebuilt the map');
  // genuinely new city
  const founded = clone(base); founded.players[0].cities.push(Object.assign(clone(base.players[0].cities[0]), {id: 9, q: 14, r: 12}));
  serve(founded); await W.refreshState();
  assert(rebuild.length === 1, 'a new city did not rebuild the map (' + rebuild.length + 'x)');
  // and one disappearing (destroyed)
  const gone = clone(founded); gone.players[0].cities.pop();
  serve(gone); await W.refreshState();
  assert(rebuild.length === 2, 'a city vanishing did not rebuild the map (' + rebuild.length + 'x)');
});

test('optimistic moves play hex-coordinate effects once the fog has caught up with the move', async () => {
  const W = await boot();
  const play = spy(W, 'playAnimation');
  // (15,10) is 4 from the city and from everything else: unseen now, in the unit's sight once it stands there
  assert(W.R3D.fogAt(15, 10) !== 0, 'precondition: the destination is out of sight');
  ev(W, "applyOptimistic({type: 'MoveUnit', unitId: 1, destQ: 15, destR: 10})");
  const types = play.map((c) => c.args[0].type).sort().join();
  assert(types === 'dustParticle,dustParticle,dustParticle,unitWalk', 'effects: ' + types);
  for (const c of play) {
    const a = c.args[0];
    assert(Number.isInteger(a.q) && Number.isInteger(a.r), a.type + ' has no hex q/r');
    assert(!hasKeys(a, 'x', 'y', 'fromX', 'fromY', 'toX', 'toY'), a.type + ' still carries pixel coordinates');
  }
  const walk = play.find((c) => c.args[0].type === 'unitWalk');
  assert(walk.args[0].q === 11 && walk.args[0].r === 10 && walk.args[0].toQ === 15 && walk.args[0].toR === 10, 'walk is not from 11,10 to 15,10');
  assert(walk.fogAtDest === 0, 'the walk was created before the destination was visible (fog ' + walk.fogAtDest + '): it would be dropped');
  assert(walk.ret === true, 'the renderer refused the walk');
  assert(ev(W, 'G.players[0].units.find(u => u.id === 1).q') === 15, 'optimistic state did not move the unit');
});

test('optimistic attacks and shots play the full set of effects in hex coordinates', async () => {
  const W = await boot();
  ev(W, 'G.players[1].units.push({id: 77, unitType: 3, q: 12, r: 10, hp: 80, mp: 2, charges: 0, fortify: 0}); resyncMap();');
  let play = spy(W, 'playAnimation');
  ev(W, "applyOptimistic({type: 'AttackUnit', unitId: 1, targetQ: 12, targetR: 10})");
  assert(play.map((c) => c.args[0].type).sort().join() === 'clashSparks,floatingText,meleeCharge,screenFlash,unitShake', 'melee effects: ' + play.map((c) => c.args[0].type).sort().join());
  for (const c of play) { const a = c.args[0]; assert(a.type === 'screenFlash' || (Number.isInteger(a.q) && Number.isInteger(a.r)), a.type + ' lacks hex q/r'); assert(!hasKeys(a, 'x', 'fromX', 'baseX'), a.type + ' has pixel fields'); }
  const charge = play.find((c) => c.args[0].type === 'meleeCharge').args[0];
  assert(charge.toQ === 12 && charge.toR === 10 && charge.player === 0 && charge.unitId === 1, 'charge: ' + JSON.stringify(charge));
  assert(play.find((c) => c.args[0].type === 'unitShake').args[0].unitId === 77, 'the defender did not shake');
  assert(play.filter((c) => c.ret === true).length >= 4, 'the renderer refused most of the melee effects: ' + play.map((c) => c.args[0].type + ':' + c.ret).join());
  play.restore();
  ev(W, 'G.players[0].units.find(u => u.id === 1).mp = 2');
  play = spy(W, 'playAnimation');
  ev(W, "applyOptimistic({type: 'RangedAttack', unitId: 1, targetQ: 12, targetR: 10})");
  assert(play.map((c) => c.args[0].type).sort().join() === 'archerFire,floatingText,projectile,rangedImpact,unitShake', 'ranged effects: ' + play.map((c) => c.args[0].type).sort().join());
  const shot = play.find((c) => c.args[0].type === 'projectile').args[0];
  assert(shot.q === 11 && shot.r === 10 && shot.toQ === 12 && shot.toR === 10, 'projectile endpoints ' + JSON.stringify(shot));
});

test('founding a city rebuilds that one tile, plays its effects, and a later refresh does not rebuild again', async () => {

test('turn-report floating numbers are created in hex coordinates', async () => {

test('the renderer never writes to the game state', async () => {
  const W = await boot();
  // the reference is what the server sent, not G at some moment: the renderer is already running when the page finishes loading
  const sent = async () => JSON.stringify(await (await W.fetch('/api/state')).json());

  ev(W, "R3D.playAnimation({type:'unitWalk', q: 11, r: 10, toQ: 12, toR: 10, player: 0, unitId: 1}); R3D.syncState(); R3D.refreshFog(); R3D.zoomBy(1.5); R3D.centerOn(5, 5); R3D.rebuildMap();");
  draw(W, 3);
  key(W, 'Escape');

});

// ───────────────────────── runner ─────────────────────────
async function runAll() {
  const failures = []; let passed = 0;
  // ?filter=<regex> runs only the tests whose name matches (used when proving a test fails on a broken build)
  const f = new URLSearchParams(location.search).get('filter'), only = f ? new RegExp(f, 'i') : null;
  const chosen = TESTS.filter((t) => !only || only.test(t.name));
  let i = 0;
  for (const t of chosen) {
    // Published before each test so a runner that times out names the test it stalled in.
    document.title = 'GAME-PROGRESS ' + JSON.stringify({done: i, total: chosen.length, name: t.name});
    i++;
    try { await t.fn(); passed++; }
    catch (e) { failures.push(t.name + ': ' + (e && e.message || e)); }
  }
  document.title = 'GAME-RESULT ' + JSON.stringify({passed, failed: failures.length, failures});
}
runAll().catch((e) => { document.title = 'GAME-RESULT ' + JSON.stringify({passed: 0, failed: 1, failures: ['page: ' + e]}); });
