<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>R3D harness</title>
<script>window.R3D_TEST = true;   // enables the test-only hooks in render3d.js</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../render3d-core.js"></script>
<script src="../render3d.js"></script>
</head>
<body>
<script>
// ── Fixture game state: 32x20, varied terrain, 2 cities, 6 units ──
// Shape mirrors GET /api/state. LM is the single landmark table: later tasks
// ADD entries here instead of inventing their own tiles.
const COLS = 32, ROWS = 20;
const LM = {
  OCEAN:  {q: 0,  r: 10},                 // deep ocean
  COAST:  {q: 2,  r: 10},                 // coast, borders ocean at (1,10)
  HILL:   {q: 8,  r: 6},                  // Grassland Hills (terrain 3)
  RIVER:  {q: 10, r: 8, edges: [1, 2]},   // top + upper-left edges: NOT symmetric under the d..d+1 bug (reciprocated on neighbors)
  SEEN:   {q: 6,  r: 5},                  // within sight of player 0
  UNSEEN: {q: 28, r: 3},                  // far from every player-0 city/unit
  FOG_SEEN:       {q: 5,  r: 6},          // in sight AND carrying props (SEEN is a city tile, which has none)
  FOG_REMEMBERED: {q: 6,  r: 9},          // explored but out of sight: 3 hexes from the nearest unit
  CITY_A: {q: 6,  r: 5, name: 'Alpha', player: 0},
  CITY_B: {q: 25, r: 14, name: 'Beta', player: 1},
  CITY_HILLS: {q: 15, r: 12, name: 'Gamma', player: 0},   // a city on hills: flattening must show here
  WOODS:      {q: 12, r: 4},              // Woods on grassland
  RAINFOREST: {q: 14, r: 4},
  WOODS2:     {q: 13, r: 6},              // second woods tile: shares colour buckets with WOODS
  MARSH:      {q: 16, r: 4},
  OASIS:      {q: 18, r: 4},              // on desert
  MOUNTAIN:   {q: 20, r: 4},
  RES_ROW:    {r: 15, q0: 4},             // resources 1..10 on q0..q0+9, row r (fish sits on a coast tile instead)
  FISH:       {q: 2,  r: 12},             // coast tile carrying Fish
  IMP_ROW:    {r: 17, q0: 4},             // improvements 1..5 on q0..q0+4
  UNIT_SETTLER: {player: 0, id: 0, q: 7,  r: 6},
  UNIT_BUILDER: {player: 0, id: 1, q: 6,  r: 6},
  UNIT_WARRIOR: {player: 0, id: 2, q: 5,  r: 5},
  UNIT_ENEMY_WARRIOR: {player: 1, id: 0, q: 24, r: 14},
  UNIT_ENEMY_ARCHER:  {player: 1, id: 1, q: 26, r: 14},
  UNIT_ENEMY_SCOUT:   {player: 1, id: 2, q: 23, r: 13},
};
const UNIT_TYPE = {settler: 0, builder: 1, scout: 2, warrior: 3, slinger: 4, archer: 5};

function buildFixture() {
  const C = window.R3DCore;
  const tiles = [];
  const flatTerrain = [2, 4];
  const variety = [2, 3, 4, 5, 6, 7, 8, 2, 4, 3, 12];
  for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
    let terrain;
    if (q <= 1 || q >= 30 || r === 0 || r === ROWS - 1) terrain = 0;
    else if (q === 2 || q === 29 || r === 1 || r === ROWS - 2) terrain = 1;
    else terrain = variety[(q * 7 + r * 13) % variety.length];
    tiles.push({q, r, terrain, feature: 0, resource: 0, riverEdges: 0, improvement: 0, ownerPlayer: 0, ownerCity: 0});
  }
  const at = (q, r) => tiles[r * COLS + q];
  // Keep every city and unit on flat, passable land.
  const anchors = [LM.CITY_A, LM.CITY_B, LM.UNIT_SETTLER, LM.UNIT_BUILDER, LM.UNIT_WARRIOR,
                   LM.UNIT_ENEMY_WARRIOR, LM.UNIT_ENEMY_ARCHER, LM.UNIT_ENEMY_SCOUT];
  for (const t of tiles) for (const a of anchors) {
    if (t.terrain > 1 && C.hexDist(t.q, t.r, a.q, a.r) <= 1) t.terrain = flatTerrain[(t.q + t.r) % 2];
  }
  at(LM.HILL.q, LM.HILL.r).terrain = 3;
  const setT = (p, terrain, props) => Object.assign(at(p.q, p.r), {terrain}, props);
  setT(LM.WOODS, 2, {feature: 1}); setT(LM.WOODS2, 2, {feature: 1}); setT(LM.RAINFOREST, 2, {feature: 2}); setT(LM.MARSH, 2, {feature: 3});
  setT(LM.OASIS, 6, {feature: 4}); setT(LM.MOUNTAIN, 12, {});
  for (let k = 1; k <= 10; k++) {
    if (k === 5) at(LM.FISH.q, LM.FISH.r).resource = 5;
    else setT({q: LM.RES_ROW.q0 + k - 1, r: LM.RES_ROW.r}, 2, {resource: k});
  }
  for (let k = 1; k <= 5; k++) setT({q: LM.IMP_ROW.q0 + k - 1, r: LM.IMP_ROW.r}, 2, {improvement: k});
  at(LM.CITY_HILLS.q, LM.CITY_HILLS.r).terrain = 3;
  // River: set edges on RIVER tile and the reciprocal edge on each neighbour.
  const rv = at(LM.RIVER.q, LM.RIVER.r);
  rv.terrain = 2;
  for (const e of LM.RIVER.edges) {
    rv.riverEdges |= (1 << e);
    const [nq, nr] = C.neighbor(LM.RIVER.q, LM.RIVER.r, e);
    const nt = at(nq, nr);
    nt.riverEdges |= (1 << ((e + 3) % 6));
    if (nt.terrain <= 1) nt.terrain = 2;
  }
  const unit = (u, type, hp) => ({id: u.id, unitType: type, q: u.q, r: u.r, hp, mp: 2, charges: 0, fortify: 0});
  const city = (c, id) => ({id, name: c.name, q: c.q, r: c.r, population: 3, hp: 200, foodStockpile: 0,
    prodStockpile: 0, production: 0, buildings: 0, foundedTurn: 1, isCapital: true, lockedTiles: []});
  const players = [
    {units: [unit(LM.UNIT_SETTLER, UNIT_TYPE.settler, 100), unit(LM.UNIT_BUILDER, UNIT_TYPE.builder, 100),
             unit(LM.UNIT_WARRIOR, UNIT_TYPE.warrior, 100)], cities: [city(LM.CITY_A, 0), city(LM.CITY_HILLS, 1)]},
    {units: [unit(LM.UNIT_ENEMY_WARRIOR, UNIT_TYPE.warrior, 100), unit(LM.UNIT_ENEMY_ARCHER, UNIT_TYPE.archer, 100),
             unit(LM.UNIT_ENEMY_SCOUT, UNIT_TYPE.scout, 100)], cities: [city(LM.CITY_B, 0)]},
  ];
  return {cols: COLS, rows: ROWS, tiles, players, currentPlayer: 0, turn: 1};
}
const FIXTURE = buildFixture();
window.R3D_FIXTURE = {state: FIXTURE, LM, COLS, ROWS};

// ── Assertions: later tasks append {name, fn} entries ──
const TESTS = [];
const tileOf = (p) => FIXTURE.tiles[p.r * COLS + p.q];
TESTS.push({name: 'hexCenter odd column shifts down', fn: () => {
  if (!(R3DCore.hexCenter(1, 0).z > 0)) throw new Error('expected z > 0');
}});

TESTS.push({name: 'CDN scripts loaded (THREE r128 + OrbitControls)', fn: () => {
  if (typeof THREE === 'undefined' || THREE.REVISION !== '128') throw new Error('THREE r128 missing');
  if (typeof THREE.OrbitControls !== 'function') throw new Error('OrbitControls missing');
}});
TESTS.push({name: 'fixture landmarks have their stated properties', fn: () => {
  const C = R3DCore, ok = (c, m) => { if (!c) throw new Error(m); };
  ok(tileOf(LM.OCEAN).terrain === 0, 'OCEAN not ocean');
  ok(tileOf(LM.COAST).terrain === 1, 'COAST not coast');
  ok(C.neighbor(LM.COAST.q, LM.COAST.r, 3).every(Number.isInteger) && tileOf({q: 1, r: 10}).terrain === 0, 'COAST has no ocean neighbour');
  ok(tileOf(LM.HILL).terrain === 3, 'HILL not hills');
  const rv = tileOf(LM.RIVER);
  for (const e of LM.RIVER.edges) {
    ok(rv.riverEdges & (1 << e), 'RIVER edge ' + e + ' unset');
    const [nq, nr] = C.neighbor(LM.RIVER.q, LM.RIVER.r, e);
    ok(FIXTURE.tiles[nr * COLS + nq].riverEdges & (1 << ((e + 3) % 6)), 'RIVER edge ' + e + ' not reciprocated');
  }
  const src = [];
  for (const p of FIXTURE.players[0].units.concat(FIXTURE.players[0].cities)) src.push(p);
  const d = (l) => Math.min(...src.map(s => C.hexDist(l.q, l.r, s.q, s.r)));
  ok(d(LM.SEEN) <= 2, 'SEEN too far from player 0');
  ok(d(LM.UNSEEN) > 8, 'UNSEEN too close to player 0');
  for (const p of FIXTURE.players) for (const o of p.units.concat(p.cities))
    ok(tileOf(o).terrain >= 2 && tileOf(o).terrain !== 12, 'object on water/mountain at ' + o.q + ',' + o.r);
  ok(FIXTURE.players.reduce((n, p) => n + p.units.length, 0) === 6, 'expected 6 units');
}});

// ── Helpers shared by assertions ──
const fixture = FIXTURE;
const wait = (ms) => new Promise(res => setTimeout(res, ms));
const assert = (c, m) => { if (!c) throw new Error(m || 'assertion failed'); };

// ── Fog model (harness-owned) ──
// Tiles carry no fog fields: the game keeps two Sets of tile indices and hands
// the renderer a fogAt(q, r) lookup, so the harness stands in for those Sets.
// It is OFF (everything visible) for every Task 5-7 assertion — those predate
// fog and several of them require that nothing is hidden — and the Task 8
// block switches it on through fogOn().
const FOGM = {on: false, state: new Int8Array(COLS * ROWS)};
(function buildFogModel() {
  const src = FIXTURE.players[0].units.concat(FIXTURE.players[0].cities);
  for (let r = 0; r < ROWS; r++) for (let q = 0; q < COLS; q++) {
    const d = Math.min(...src.map(s => R3DCore.hexDist(q, r, s.q, s.r)));
    FOGM.state[r * COLS + q] = R3DCore.fogOf(d <= 5, d <= 2, true);
  }
})();
const harnessFogAt = (q, r) => (FOGM.on ? FOGM.state[r * COLS + q] : R3DCore.FOG.VISIBLE);
const fogOn = () => { FOGM.on = true; R3D.refreshFog(); };
// Every tile unexplored for the duration of fn: the pixel assertions need a
// frame in which anything lit at all is a leak.
const allFog = (fn) => {
  const saved = FOGM.state.slice(), wasOn = FOGM.on;
  FOGM.state.fill(R3DCore.FOG.UNSEEN); FOGM.on = true;
  R3D.refreshFog();
  try { return fn(); } finally { FOGM.state.set(saved); FOGM.on = wasOn; R3D.refreshFog(); }
};
// How many pixels of the drawn frame change when the ground is taken away.
// This is the fog's whole job stated literally — if the fog hides the ground,
// removing the ground changes nothing — and unlike a brightness threshold it
// cannot be fooled by a cliff that happens to be in shadow (the first version
// of this check was, and counted zero on a leak that was plainly visible).
const FRAME = {x: 0, y: 0, w: 800, h: 500};
// The ground is taken away by turning off its COLOUR only (it still writes
// depth). Deleting it outright also removes the depth test that culls the
// shell's far-side faces, and the shell is a stack of 99.5%-opaque layers
// whose last-drawn face wins, so the frame changes for reasons unrelated to
// whether the ground shows (that false alarm is what failed two views).
const groundPixels = () => {
  const a = __r3d.renderAndSample(FRAME.x, FRAME.y, FRAME.w, FRAME.h);
  __r3d.setTerrainVisible(false);
  const b = __r3d.renderAndSample(FRAME.x, FRAME.y, FRAME.w, FRAME.h);
  __r3d.setTerrainVisible(true);
  let n = 0, worst = null;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    if (d <= 8) continue;              // ignore dithering on the 0.5% the fog lets through
    n++;
    if (!worst || d > worst.d) worst = {d, ground: [a[i], a[i + 1], a[i + 2]], without: [b[i], b[i + 1], b[i + 2]],
      at: [(i / 4) % FRAME.w, Math.floor((i / 4) / FRAME.w)]};
  }
  return {n, worst, total: FRAME.w * FRAME.h};
};
const testCanvas = document.createElement('canvas');
testCanvas.width = 800; testCanvas.height = 500;
document.body.appendChild(testCanvas);

// ── Task 5: renderer bootstrap ──
TESTS.push({name: 'init succeeds with WebGL', fn: () =>
  assert(R3D.init({canvas: testCanvas, getState: () => fixture, fogAt: harnessFogAt}) === true)});
TESTS.push({name: 'init returns false without WebGL', fn: () => {
  const dead = document.createElement('canvas');
  dead.getContext = () => null;
  assert(R3D.init({canvas: dead, getState: () => fixture}) === false);
}});
TESTS.push({name: 'failed init leaves the live renderer intact', fn: async () => {
  const before = __r3d.frames(); R3D.requestRender(); await wait(100);
  assert(__r3d.frames() > before, 'renderer died after a failed init');
}});
TESTS.push({name: 'the loop idles when nothing animates (reduced motion, water off)', fn: async () => {
  __r3d.setReducedMotion(true);
  try {
    await wait(200);
    const before = __r3d.frames(); await wait(300);
    assert(__r3d.frames() - before <= 2, 'idle renderer should not redraw every frame');
  } finally { __r3d.setReducedMotion(false); }
}});
TESTS.push({name: 'ambient water redraws at a modest rate, well under every frame', fn: () => {
  // Driven with a synthetic clock through the loop body, so CPU load cannot
  // change the answer. The real loop is idle while this runs (synchronous).
  const t0 = performance.now(), drew = [];
  for (let i = 0; i < 36; i++) drew.push(__r3d.step(t0 + i * 16.67));   // 36 ticks of 60 Hz = 0.6 s
  const n = drew.filter(Boolean).length, perSecond = n / (36 * 16.67 / 1000);
  assert(perSecond >= 12 && perSecond <= 25, 'ambient frames per second: ' + perSecond);
  assert(n < 18, 'redrew at least half of the 60 Hz ticks');
  __r3d.renderAndSample(0, 0, 1, 1);   // drain the GPU queue so the real loop is not left behind
  __r3d.resetAmbientClock();           // hand the clock back to real time
}});
TESTS.push({name: 'requestRender draws one frame', fn: async () => {
  await wait(100);
  const before = __r3d.frames(); R3D.requestRender(); await wait(100);
  assert(__r3d.frames() > before, 'frames ' + before + ' -> ' + __r3d.frames());
}});
TESTS.push({name: 'camera controls: left pans, right rotates, polar angle clamped', fn: () => {
  const c = __r3d.controls();
  assert(c.mouseButtons.LEFT === THREE.MOUSE.PAN, 'left must pan');
  assert(c.mouseButtons.RIGHT === THREE.MOUSE.ROTATE, 'right must rotate');
  assert(c.mouseButtons.MIDDLE === THREE.MOUSE.DOLLY, 'middle must dolly');
  assert(c.screenSpacePanning === false, 'panning must stay on the ground');
  assert(c.maxPolarAngle < Math.PI / 2, 'camera could go under terrain');
}});
TESTS.push({name: 'getCameraView reports a positive span', fn: () => {
  const v = R3D.getCameraView();
  assert(isFinite(v.x) && isFinite(v.z) && v.span > 0, JSON.stringify(v));
}});
TESTS.push({name: 'setCameraDistance changes the view span', fn: async () => {
  __r3d.setCameraDistance(10); const a = R3D.getCameraView().span;
  __r3d.setCameraDistance(40); const b = R3D.getCameraView().span;
  assert(b > a * 2, 'span ' + a + ' -> ' + b);
}});
TESTS.push({name: 'panToHex moves the camera target', fn: async () => {
  R3D.centerOn(LM.CITY_A.q, LM.CITY_A.r);
  const c = R3DCore.hexCenter(LM.CITY_A.q, LM.CITY_A.r), v = R3D.getCameraView();
  assert(Math.abs(v.x - c.x) < 0.5, 'x ' + v.x + ' vs ' + c.x);
}});
TESTS.push({name: 'a throwing animation is dropped and rendering continues', fn: async () => {
  const origErr = console.error; console.error = () => {};
  try {
    R3D.playAnimation({tick: () => { throw new Error('boom'); }});
    await wait(150);
    const before = __r3d.frames(); R3D.requestRender(); await wait(150);
    assert(__r3d.frames() > before, 'renderer wedged after a throwing animation');
    assert(__r3d.animCount() === 0, 'throwing animation still registered: ' + __r3d.animCount());
  } finally { console.error = origErr; }
}});

// ── Task 6: terrain chunks, water, rivers ──
TESTS.push({name: 'the map is a few dozen chunks, not 640 meshes', fn: () =>
  assert(__r3d.chunkCount() > 20 && __r3d.chunkCount() < 80, 'chunks: ' + __r3d.chunkCount())});
TESTS.push({name: 'the renderer never writes into game state', fn: () => {
  assert(fixture.tiles.every(t => !('hasCity' in t)), 'a tile carries hasCity');
}});
TESTS.push({name: 'a city tile builds flatter than the same tile without its city', fn: () => {
  const c = LM.CITY_HILLS, range = () => { const y = __r3d.tileYRange(c.q, c.r); return y.max - y.min; };
  assert(tileOf(c).terrain === 3, 'fixture city must stand on hills');
  const flat = range();
  const cities = fixture.players[0].cities, i = cities.findIndex(x => x.name === c.name), gone = cities.splice(i, 1)[0];
  try { R3D.rebuildTile(c.q, c.r); var bumpy = range(); }
  finally { cities.splice(i, 0, gone); R3D.rebuildTile(c.q, c.r); }
  assert(bumpy > 0.1, 'hills tile should have relief, got ' + bumpy);
  assert(flat < bumpy * 0.5, 'city tile ' + flat + ' vs ' + bumpy);
}});
TESTS.push({name: 'a skirt closes the step at a shoreline but not between equal land', fn: () => {
  const coast = __r3d.tileYRange(LM.COAST.q, LM.COAST.r), land = __r3d.tileYRange(LM.HILL.q, LM.HILL.r);
  // ocean base -0.35, skirt drops to just below it
  assert(coast.min < R3DCore.tileBase({terrain: 0}) - 0.04, 'no skirt at shoreline, min y ' + coast.min);
  assert(land.min > 0, 'land tile with land neighbours must have no skirt, min y ' + land.min);
}});
TESTS.push({name: 'rebuildTile reads the live tile, not a cached object', fn: () => {
  const orig = fixture.tiles, q = 20, r = 12;
  try {
    fixture.tiles = orig.map(t => Object.assign({}, t));     // what a state refresh does
    fixture.tiles[r * 32 + q].terrain = 0;
    R3D.rebuildTile(q, r);
    const y = __r3d.tileYRange(q, r);
    assert(y.max < 0, 'chunk was built from a stale tile, max y ' + y.max);
  } finally { fixture.tiles = orig; R3D.rebuildTile(q, r); }
  assert(__r3d.tileYRange(q, r).max > 0, 'did not restore');
}});
TESTS.push({name: 'changing one tile rebuilds only its own chunk', fn: () => {
  const mine = __r3d.chunkVersion(4, 4), other = __r3d.chunkVersion(28, 18);
  fixture.tiles[4 * 32 + 4].improvement = 2;   // index = r*32 + q
  R3D.rebuildTile(4, 4);
  assert(__r3d.chunkVersion(4, 4) === mine + 1, 'owning chunk must rebuild');
  assert(__r3d.chunkVersion(28, 18) === other, 'other chunks must not');
}});
TESTS.push({name: 'tiles in the same 4x4 block share a chunk, neighbours do not', fn: () => {
  const a = __r3d.chunkVersion(5, 5);
  R3D.rebuildTile(4, 4);
  assert(__r3d.chunkVersion(5, 5) === a + 1, 'same block must share');
  const b = __r3d.chunkVersion(8, 4);
  R3D.rebuildTile(4, 4);
  assert(__r3d.chunkVersion(8, 4) === b, 'next block must not rebuild');
}});
TESTS.push({name: 'chunks are frustum culled', fn: async () => {
  R3D.centerOn(2, 2); await wait(400);
  assert(__r3d.visibleChunks() < __r3d.chunkCount(), 'visible ' + __r3d.visibleChunks());
  assert(__r3d.visibleChunks() >= 1, 'nothing visible');
}});
TESTS.push({name: 'rivers are drawn on the edges the bitmask names', fn: () => {
  assert(__r3d.riverDrawCalls() >= 1);
  const want = R3DCore.riverEdges(tileOf(LM.RIVER));
  assert(want.length === 2);
  assert(__r3d.riverSegmentsOn(LM.RIVER.q, LM.RIVER.r) === want.length,
    __r3d.riverSegmentsOn(LM.RIVER.q, LM.RIVER.r) + ' vs ' + want.length);
  assert(__r3d.riverSegmentsOn(LM.HILL.q, LM.HILL.r) === 0, 'river on a dry tile');
}});
TESTS.push({name: 'river ribbon vertices lie on the boundary shared with neighbour d', fn: () => {
  const ca = R3DCore.hexCenter(LM.RIVER.q, LM.RIVER.r), quads = __r3d.riverQuads(LM.RIVER.q, LM.RIVER.r);
  assert(quads.length === LM.RIVER.edges.length, 'quads ' + quads.length);
  for (const d of LM.RIVER.edges) {
    const [nq, nr] = R3DCore.neighbor(LM.RIVER.q, LM.RIVER.r, d), cb = R3DCore.hexCenter(nq, nr);
    const mx = (ca.x + cb.x) / 2, mz = (ca.z + cb.z) / 2;      // midpoint of the shared edge
    const hit = quads.some(qd => {
      const cx = qd.reduce((a, v) => a + v[0], 0) / 4, cz = qd.reduce((a, v) => a + v[1], 0) / 4;
      return Math.hypot(cx - mx, cz - mz) < 0.01;
    });
    assert(hit, 'no ribbon centred on the edge shared with neighbour ' + d);
    // and every vertex stays within a ribbon width of the line between the centres
    const L = Math.hypot(cb.x - ca.x, cb.z - ca.z), ux = (cb.x - ca.x) / L, uz = (cb.z - ca.z) / L;
    for (const qd of quads) {
      const cx = qd.reduce((a, v) => a + v[0], 0) / 4, cz = qd.reduce((a, v) => a + v[1], 0) / 4;
      if (Math.hypot(cx - mx, cz - mz) > 0.01) continue;
      // edge runs perpendicular to the centre line: along-line offset of each vertex ~ +-width/2
      for (const v of qd) assert(Math.abs((v[0] - mx) * ux + (v[1] - mz) * uz) < 0.1, 'vertex off the shared edge');
    }
  }
}});
TESTS.push({name: 'all rivers share a draw call or two', fn: () =>
  assert(__r3d.riverDrawCalls() <= 2, 'calls ' + __r3d.riverDrawCalls())});
TESTS.push({name: 'the water plane sits above the seabed', fn: () =>
  assert(__r3d.waterLevel() > R3DCore.tileBase({terrain: 0}))});
TESTS.push({name: 'the water plane is above the coast floor and below land', fn: () =>
  assert(__r3d.waterLevel() > R3DCore.tileBase({terrain: 1}) && __r3d.waterLevel() < R3DCore.tileBase({terrain: 2}))});
TESTS.push({name: 'chunk and river counts fit the draw-call budget', fn: async () => {
  R3D.requestRender(); await wait(150);
  assert(__r3d.drawCalls() < 300, 'draw calls ' + __r3d.drawCalls());
}});

// ── Task 7: instanced scenery ──
TESTS.push({name: 'scenery is instanced, not thousands of meshes', fn: () =>
  assert(__r3d.sceneCount() < 200, `scene has ${__r3d.sceneCount()} objects`)});
TESTS.push({name: 'every resource and improvement type has geometry', fn: () => {
  for (let res = 1; res <= 10; res++) assert(__r3d.hasResourceArt(res), `resource ${res}`);

TESTS.push({name: 'every shell vertex sits just above the surface it covers', fn: () => {

    const p = LM[k], tile = Object.assign({}, tileOf(p), k === 'CITY_HILLS' ? {hasCity: true} : {});

    for (const v of verts) {
      let g = R3DCore.heightAt(tile, v[0], v[2]);

// Leak 8 (the cliff under an unexplored map edge) and leak 7 (the terrain
// skirt z-fighting through the fog at a coast) are both invisible to any
// assertion about geometry alone, so these draw frames and compare pixels.
// The water plane is hidden: the open sea past the map edge is backdrop, not
// the map's own ground, and the question here is only whether the ground
// shows. The geometry assertion above covers the same property with the
// water on. A few dozen pixels survive on the seam between each shell's top
// and its skirt — rasterisation cracks — while a real leak runs to thousands.
const GRAZE = 1.29;     // the steepest angle the polar clamp allows
for (const view of [
  {name: 'a grazing map edge', q: COLS - 1, r: 10, az: Math.PI / 2},
  {name: 'a grazing coast', q: LM.COAST.q, r: LM.COAST.r, az: -Math.PI / 2},
  {name: 'grazing hill country', q: LM.HILL.q, r: LM.HILL.r, az: -Math.PI / 2},
  {name: 'the whole map from above', q: 16, r: 10, az: 0, dist: 55, polar: 0.5},
]) {
  TESTS.push({name: 'unexplored ground shows no pixel of itself at ' + view.name, fn: () => {
    __r3d.setWaterVisible(false);
    try {
      allFog(() => {
        __r3d.lookAt(view.q, view.r, view.dist || 7, view.polar || GRAZE, view.az);
        const got = groundPixels();
        assert(got.n <= 200, got.n + ' pixels of ' + got.total + ' change when the ground is removed: ' +
          JSON.stringify(got.worst));
      });
    } finally { __r3d.setWaterVisible(true); }
  }});
}

    assert(before - __r3d.fogShellHeightAt(t.q, t.r, 'centre') > 0.1, 'precondition: a city must level this ground');
    assert(__r3d.fogShellState('unseen', t.q, t.r) === 'live', 'the unseen shell kept the ground the city levelled');
    assert(__r3d.fogShellState('remembered', t.q, t.r) === 'collapsed', 'the remembered shell appeared on unexplored ground');
  } finally { cities.pop(); R3D.rebuildTile(t.q, t.r); }
}});


// ── Task 9: tile edges, overlays and rings ──
const mkSel = (o) => Object.assign({kind: 'unit', q: LM.FOG_SEEN.q, r: LM.FOG_SEEN.r, moveTiles: [], attackTiles: [],
  rangedTiles: [], workedTiles: [], lockedTiles: []}, o);
const clearMarks = () => { R3D.setSelection(null); R3D.setHover(null); };
// Waits for the real loop to draw a frame, however slowly this machine runs it.
const nextFrame = async () => {
  const f = __r3d.frames(); R3D.requestRender();
  const dead = performance.now() + 10000;
  while (__r3d.frames() === f && performance.now() < dead) await wait(10);
  assert(__r3d.frames() > f, 'the loop drew no frame in 10 s');
};
// player is a number, or a function of the tile. fn may be async: ownership is
// restored only after it has settled.
const withOwner = async (list, player, fn) => {
  const was = list.map(p => { const t = tileOf(p); return [t, t.ownerPlayer, t.ownerCity]; });
  for (const p of list) { const t = tileOf(p); t.ownerPlayer = typeof player === 'function' ? player(t) : player; t.ownerCity = 1; }
  R3D.syncState();
  try { return await fn(); } finally { for (const [t, a, b] of was) { t.ownerPlayer = a; t.ownerCity = b; } R3D.syncState(); }
};
const flower = (c) => [c].concat([0, 1, 2, 3, 4, 5].map(d => { const [q, r] = R3DCore.neighbor(c.q, c.r, d); return {q, r}; }));
TESTS.push({name: 'the whole hex grid is one draw call, counted by the renderer', fn: () => {
  assert(__r3d.gridDrawCalls() === 1, 'grid render calls: ' + __r3d.gridDrawCalls());
}});
TESTS.push({name: 'every overlay category shares one layer: one render call', fn: () => {
  const sel = mkSel({moveTiles: [{q: 5, r: 4}], attackTiles: [{q: 4, r: 4}], rangedTiles: [{q: 4, r: 5}],
    workedTiles: [{q: 6, r: 4}], lockedTiles: [{q: 7, r: 5}], dimTiles: [{q: 8, r: 5}]});
  R3D.setSelection(sel);
  try {
    assert(__r3d.litTiles() === 6, __r3d.litTiles() + ' lit');
    assert(__r3d.overlayDrawCalls() === 1, 'overlay render calls: ' + __r3d.overlayDrawCalls());
    assert(new Set(__r3d.litList().map(g => g.color)).size === 6, 'six categories, six colours');
  } finally { clearMarks(); }
}});
TESTS.push({name: 'grid lines fade as the camera pulls back', fn: async () => {
  R3D.centerOn(16, 10);
  const at = async (d) => { __r3d.setCameraDistance(d); await nextFrame(); return __r3d.gridOpacity(); };
  const near = await at(14), mid = await at(30), far = await at(60);
  await at(14);
  assert(near > 0.3, 'edges are faint up close: ' + near);
  assert(near > mid && mid > far, 'fade is not monotonic: ' + [near, mid, far]);
  assert(far < 0.05, 'edges still show at the far zoom: ' + far);
}});
TESTS.push({name: 'hex edges are drawn once each and absent on open ocean', fn: () => {
  const L = LM, ocean = L.OCEAN, coast = L.COAST;
  assert(!__r3d.gridHasEdge(ocean.q, ocean.r, 1, 10), 'an edge between two ocean tiles is drawn');
  assert(!__r3d.gridHasEdge(1, 10, coast.q, coast.r), 'an edge between ocean and coast is drawn');
  assert(__r3d.gridHasEdge(coast.q, coast.r, 3, 10), 'the shoreline between coast and land is missing');
  assert(__r3d.gridHasEdge(8, 6, 9, 6) && __r3d.gridHasEdge(9, 6, 8, 6), 'an inland edge is missing or direction-dependent');
  let land = 0, shore = 0;
  const seen = new Set();
  for (const t of fixture.tiles) for (let d = 0; d < 6; d++) {
    const [nq, nr] = R3DCore.neighbor(t.q, t.r, d), nt = nq >= 0 && nr >= 0 && nq < COLS && nr < ROWS ? tileOf({q: nq, r: nr}) : null;
    if (t.terrain <= 1 && (!nt || nt.terrain <= 1)) continue;
    const a = t.r * COLS + t.q, b = nt ? nr * COLS + nq : -1, k = Math.min(a, b) + '|' + Math.max(a, b);
    if (!seen.has(k)) { seen.add(k); land++; }
  }
  assert(__r3d.gridSegments() === land, 'built ' + __r3d.gridSegments() + ' ribbons for ' + land + ' land edges');
}});
TESTS.push({name: 'setSelection lights exactly the tiles overlayList returns', fn: () => {
  const sel = mkSel({q: 4, r: 4, moveTiles: [{q: 5, r: 4}, {q: 4, r: 5}]});
  R3D.setSelection(sel);
  try { assert(__r3d.litTiles() === R3DCore.overlayList(sel, R3D.fogAt).length && __r3d.litTiles() === 2, 'lit ' + __r3d.litTiles()); }
  finally { clearMarks(); }
}});
TESTS.push({name: 'each overlay is lit at its own tile in its own colour', fn: () => {
  const OVc = R3DCore.OV, C = R3DCore;
  const sel = mkSel({attackTiles: [{q: 5, r: 4}], rangedTiles: [{q: 4, r: 4}], moveTiles: [{q: 4, r: 5}],
    lockedTiles: [{q: 7, r: 5}], workedTiles: [{q: 6, r: 4}, {q: 5, r: 4}]});
  R3D.setSelection(sel);
  try {
    const want = C.overlayList(sel, R3D.fogAt), got = __r3d.litList();
    assert(want.length === 5 && got.length === 5, 'lit ' + got.length);
    for (let i = 0; i < want.length; i++) {
      const c = C.hexCenter(want[i].q, want[i].r);
      assert(Math.abs(got[i].x - c.x) < 1e-4 && Math.abs(got[i].z - c.z) < 1e-4, 'overlay ' + i + ' is not on tile ' + want[i].q + ',' + want[i].r);
      assert(got[i].color === want[i].color, 'overlay ' + i + ' colour ' + got[i].color.toString(16) + ' vs ' + want[i].color.toString(16));
      assert(got[i].y > C.heightAt(tileOf(want[i]), c.x, c.z), 'overlay sunk into the ground at ' + want[i].q + ',' + want[i].r);
    }
    assert(got.some(g => g.color === OVc.atk) && got.some(g => g.color === OVc.rng) && got.some(g => g.color === OVc.lock), 'a category is missing');
  } finally { clearMarks(); }
}});
TESTS.push({name: 'unexplored tiles are never lit, in any overlay category', fn: () => {
  fogOn();
  const U = LM.UNSEEN, S0 = LM.FOG_SEEN;
  try {
    for (const key of ['moveTiles', 'attackTiles', 'rangedTiles', 'workedTiles', 'lockedTiles']) {

      assert(__r3d.litTiles() === 1, key + ': lit ' + __r3d.litTiles() + ' of 2');

}});
TESTS.push({name: 'overlays follow the fog when it changes under a standing selection', fn: () => {
  fogOn();

    FOGM.state[i] = R3DCore.FOG.UNSEEN; R3D.refreshFog();

  } finally { FOGM.state[i] = was; R3D.refreshFog(); clearMarks(); }
}});
TESTS.push({name: 'the selection ring and the hover ring sit on their own tiles', fn: () => {
  const c = R3DCore.hexCenter;
  R3D.setSelection(mkSel({q: 6, r: 6})); R3D.setHover(8, 6);
  try {
    const s = __r3d.ringCentre('selection'), h = __r3d.ringCentre('hover');
    assert(s && Math.abs(s.x - c(6, 6).x) < 1e-3 && Math.abs(s.z - c(6, 6).z) < 1e-3, 'selection ring at ' + JSON.stringify(s));
    assert(h && Math.abs(h.x - c(8, 6).x) < 1e-3 && Math.abs(h.z - c(8, 6).z) < 1e-3, 'hover ring at ' + JSON.stringify(h));
    R3D.setHover(null);
    assert(__r3d.ringCentre('hover') === null, 'hover ring stayed after the pointer left');
    R3D.setSelection(null);
    assert(__r3d.ringCentre('selection') === null, 'selection ring stayed after deselect');
  } finally { clearMarks(); }
}});
TESTS.push({name: 'no ring is drawn on unexplored ground', fn: () => {
  fogOn();
  try {
    R3D.setSelection(mkSel({q: LM.UNSEEN.q, r: LM.UNSEEN.r})); R3D.setHover(LM.UNSEEN.q, LM.UNSEEN.r);
    assert(__r3d.ringCentre('selection') === null && __r3d.ringCentre('hover') === null, 'a ring marks unexplored ground');
  } finally { clearMarks(); }
}});
TESTS.push({name: 'territory fills owned tiles and outlines only the outer edge', fn: async () => {
  fogOn();
  await withOwner(flower(LM.CITY_A), 0, () => {
    assert(__r3d.territoryTiles() === 7, 'territory tiles ' + __r3d.territoryTiles());

  });

  fogOn();
  await withOwner(flower(LM.UNSEEN), 1, () => {
    assert(__r3d.fogOf(LM.UNSEEN.q, LM.UNSEEN.r) === R3DCore.FOG.UNSEEN, 'precondition');
    assert(__r3d.territoryTiles() === 0 && __r3d.borderSegments() === 0,

  });

TESTS.push({name: 'the renderer leaves tiles exactly as the game made them', fn: async () => {
  const keys = 'q,r,terrain,feature,resource,riverEdges,improvement,ownerPlayer,ownerCity';
  await withOwner(flower(LM.CITY_A), 0, () => R3D.setSelection(mkSel({moveTiles: [{q: 5, r: 4}]})));
  R3D.setHover(5, 5); clearMarks();

  assert(fixture.players[0].cities.every(c => !('hasCity' in c)));
}});
TESTS.push({name: 'every layer is in the table, below the unexplored fog', fn: () => {
  const O = __r3d.renderOrderOf;
  assert(O('overlays') === 3 && O('selRing') === 4 && O('hoverRing') === 4, [O('overlays'), O('selRing'), O('hoverRing')]);
  for (const k of ['grid', 'territory', 'borders']) assert(O(k) > 0 && O(k) < O('fogUnseen'), k + ' at ' + O(k));
  assert(__r3d.drawablesAtOrAboveUnseenFog() === 0);
}});
TESTS.push({name: 'marks add six draw calls, measured by the renderer, inside the budget', fn: async () => {
  await withOwner(flower(LM.CITY_A), 0, async () => {
    R3D.setSelection(mkSel({moveTiles: [{q: 5, r: 4}], q: 6, r: 6})); R3D.setHover(7, 6);
    try {
      assert(__r3d.territoryTiles() === 7 && __r3d.borderSegments() === 18, 'precondition: territory is drawn');
      assert(__r3d.markDrawCalls() === 6, 'mark render calls ' + __r3d.markDrawCalls());
      R3D.centerOn(16, 10); __r3d.setCameraDistance(14); await nextFrame();
      assert(__r3d.drawCalls() < 300, 'draw calls ' + __r3d.drawCalls());
      R3D.centerOn(6, 6); __r3d.setCameraDistance(90); await nextFrame();

    } finally { clearMarks(); __r3d.setCameraDistance(14); }
  });
}});

// Pixel pins. Everything is lit with the fog filter OFF (setMarksUnfiltered) on a
// map that is entirely unexplored: the only thing keeping the marks off the
// screen is the draw order and transparency, which is the defence these prove.
// The frame with the marks must equal the frame without them.
const diffFrames = (layer) => {
  const a = __r3d.renderAndSample(FRAME.x, FRAME.y, FRAME.w, FRAME.h);
  __r3d.setMarksVisible(false, layer);
  const b = __r3d.renderAndSample(FRAME.x, FRAME.y, FRAME.w, FRAME.h);
  __r3d.setMarksVisible(true, layer);
  let n = 0, worst = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    if (d > 8) { n++; worst = Math.max(worst, d); }
  }
  return {n, worst};
};
for (const view of [{name: 'close', dist: 9, polar: 0.9}, {name: 'grazing', dist: 8, polar: GRAZE}, {name: 'from above', dist: 30, polar: 0.4}]) {
  TESTS.push({name: 'no mark shows through unexplored fog (' + view.name + ')', fn: async () => {
    const hexes = [];
    for (let r = 1; r <= 10; r++) for (let q = 2; q <= 12; q++) hexes.push({q, r});
    await withOwner(hexes, 0, () => allFog(() => {
      __r3d.setMarksUnfiltered(true);
      try {
        R3D.setSelection(mkSel({q: 6, r: 5, moveTiles: hexes.slice(0, 30), attackTiles: hexes.slice(30, 50),
          rangedTiles: hexes.slice(50, 70), workedTiles: hexes.slice(70, 90), lockedTiles: hexes.slice(90, 110)}));
        R3D.setHover(7, 5);
        __r3d.lookAt(7, 5, view.dist, view.polar, 0.4);
        assert(__r3d.litTiles() === 110 && __r3d.territoryTiles() === hexes.length && __r3d.ringCentre('selection'), 'precondition: the marks are lit');
        const got = diffFrames();
        assert(got.n <= 200, got.n + ' pixels change when the marks are removed (worst ' + got.worst + ')');
      } finally { __r3d.setMarksUnfiltered(false); clearMarks(); }
    }));
  }});
}
// Visible-on-explored pins: each mark layer, with the layer taken away, must
// change a real number of pixels on ground the player can see. Counters and
// buffer readers cannot notice a ring sunk under the ground; pixels can.
const SEE = {q: 7, r: 6, dist: 9, polar: 0.9, az: 0.4};
const seenDiff = (layer) => {
  __r3d.lookAt(SEE.q, SEE.r, SEE.dist, SEE.polar, SEE.az);
  return diffFrames(layer);
};
const needPixels = (layer, min) => {
  const got = seenDiff(layer);
  assert(got.n >= min, layer + ' changes only ' + got.n + ' pixels on explored ground (want >= ' + min + ')');
};
TESTS.push({name: 'the selection ring is visible on explored ground', fn: () => {
  fogOn(); R3D.setSelection(mkSel({q: 6, r: 6}));
  try { needPixels('selRing', 800); } finally { clearMarks(); }
}});
TESTS.push({name: 'the hover ring is visible on explored ground', fn: () => {
  fogOn(); R3D.setHover(7, 6);
  try { needPixels('hoverRing', 400); } finally { clearMarks(); }
}});
TESTS.push({name: 'overlay discs are visible on explored ground', fn: () => {
  fogOn(); R3D.setSelection(mkSel({q: 6, r: 6, moveTiles: [{q: 7, r: 6}, {q: 6, r: 7}], dimTiles: [{q: 8, r: 6}]}));
  try { needPixels('overlays', 3000); } finally { clearMarks(); }
}});
TESTS.push({name: 'territory fill and borders are visible on explored ground', fn: async () => {
  fogOn();
  await withOwner(flower({q: 7, r: 6}), 0, () => { needPixels('territory', 3000); needPixels('borders', 800); });
}});
TESTS.push({name: 'the grid lines are visible on explored ground', fn: () => { fogOn(); needPixels('grid', 300); }});

// Leak 2 class: marks that float above the shell's own outline. Hill tiles
// at close range, grazing, every edge a border, every overlay category lit,
// fog filter off. Flat discs at the crest height stuck out past the shell here.
for (const v of [
  {name: 'hill (8,6) east', q: 8, r: 6, az: Math.PI / 2}, {name: 'hill (8,6) west', q: 8, r: 6, az: -Math.PI / 2},
  {name: 'hill (8,6) north', q: 8, r: 6, az: Math.PI}, {name: 'hill city (15,12)', q: 15, r: 12, az: 0.3},
  {name: 'hill city (15,12) west', q: 15, r: 12, az: -Math.PI / 2}, {name: 'coast (2,10)', q: 2, r: 10, az: -Math.PI / 2},
  {name: 'map edge', q: COLS - 1, r: 10, az: Math.PI / 2},
]) {
  TESTS.push({name: 'no mark pokes past the shell silhouette on slopes: ' + v.name, fn: async () => {
    __r3d.setWaterVisible(false);
    const all = fixture.tiles.map(t => ({q: t.q, r: t.r}));
    try {
      await withOwner(all, (t) => (t.q * 7 + t.r * 13 + (t.q >> 1)) % 3, () => allFog(() => {
        __r3d.setMarksUnfiltered(true);
        try {
          const by = (k) => all.filter(t => (t.q + 3 * t.r) % 5 === k);
          R3D.setSelection(mkSel({q: v.q, r: v.r, moveTiles: by(0), attackTiles: by(1), rangedTiles: by(2),
            workedTiles: by(3), lockedTiles: by(4), dimTiles: all}));
          R3D.setHover(v.q, v.r);
          __r3d.lookAt(v.q, v.r, 6, GRAZE, v.az);
          assert(__r3d.litTiles() === all.length && __r3d.borderSegments() > 400, 'precondition: everything is lit');
          const got = diffFrames();
          assert(got.n <= 200, got.n + ' pixels of marks show outside the fog (worst ' + got.worst + ')');
        } finally { __r3d.setMarksUnfiltered(false); clearMarks(); }
      }));
    } finally { __r3d.setWaterVisible(true); }
  }});
}
TESTS.push({name: 'an unexplored neighbour always gets a border, whoever owns it', fn: async () => {
  fogOn();

  __r3d.setWaterVisible(false);

async function runAll() {
  const failures = [];
  let passed = 0;
  for (const t of TESTS) {
    try { await t.fn(); passed++; }
    catch (e) { failures.push(t.name + ': ' + (e && e.message || e)); }
  }
  document.title = 'R3D-RESULT ' + JSON.stringify({passed, failed: failures.length, failures});
}
window.R3D_TESTS = TESTS;
runAll().catch(e => { document.title = 'R3D-RESULT ' + JSON.stringify({passed: 0, failed: 1, failures: ['harness: ' + e]}); });
</script>
